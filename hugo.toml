baseURL = 'https://the-raccoon-way.de/'
languageCode = 'de'
defaultContentLanguage = 'de'
title = 'The Raccoon Way'
theme = 'PaperMod'
paginate = 10

[outputFormats.llms]
  baseName = 'llms'
  mediaType = 'text/plain'
  isPlainText = true
  notAlternative = true

[outputs]
  home = ['HTML', 'RSS', 'llms']

[params]
  author = 'Daniela Zurwerra'
  description = 'Praxiswissen zu Power Platform, Power Automate, Copilot Studio und Azure von Daniela Zurwerra: Tutorials, MCP-Server und Low-Code-Automatisierung.'
  keywords = ['Power Platform', 'Power Automate', 'Low Code', 'Automatisierung']
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  defaultTheme = 'auto'

  [params.analytics.umami]
    websiteID = 'af09530a-757f-4427-ac84-f5f3452f3000'
    jsURL = 'https://cloud.umami.is/script.js'

  [params.profileMode]
    enabled = true
    title = 'The Raccoon Way'
    subtitle = 'From No-Code to No-Limits'
    imageUrl = '/images/Raccoon-Sticker.png'
    imageWidth = 200
    imageHeight = 200
    imageTitle = 'The Raccoon Way'
    [[params.profileMode.buttons]]
      name = 'Blog'
      url = '/posts'

  [params.cover]
    hiddenInList = true

